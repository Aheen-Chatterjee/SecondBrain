[project]
name = "secondbrain-backend"
version = "0.1.0"
description = "Second Brain FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.29,<0.35",
    "sqlalchemy>=2.0.29,<2.1",
    "aiosqlite>=0.20,<0.21",
    "asyncpg>=0.29,<0.31",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "pyjwt>=2.8,<3",
    "httpx>=0.27,<0.28",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
